name: Update Dashboard Stats

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so we can pull --rebase before push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect and push stats
        working-directory: scripts
        env:
          # GitHub
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

          # Last.fm
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}

          # Grafana Cloud
          GRAFANA_CLOUD_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
          GRAFANA_CLOUD_METRICS_ID: ${{ secrets.GRAFANA_CLOUD_METRICS_ID }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}

          # CTF Platforms (optional)
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
          THM_USERNAME: ${{ secrets.THM_USERNAME }}
          CTFTIME_TEAM_ID: ${{ secrets.CTFTIME_TEAM_ID }}
        run: python pushToGrafana.py   # make sure this matches the filename exactly

      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: scripts/stats.json
          retention-days: 7

      - name: Commit stats.json if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f scripts/stats.json ]; then
            mv scripts/stats.json stats.json
            git add stats.json

            # If nothing changed, stop here
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update stats.json [skip ci]"

            # Rebase on latest main to avoid non-fast-forward push
            git pull --rebase origin main

            # Push using the GITHUB_TOKEN configured by actions/checkout
            git push
          else
            echo "No stats.json found, skipping commit"
          fi
